{% load static %}

<!DOCTYPE html>
<html>

    <head>

        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>{% block title %}{% endblock %}</title>

        <!-- Favicons -->
        <link rel="icon" href="{% static 'img/favicon.ico' %}" >
        
        <!-- Google Fonts -->
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Raleway:300,300i,400,400i,500,500i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
            >

        <!-- Vendor CSS Files -->
        <link rel="stylesheet" href="{% static 'vendor/animate.css/animate.min.css' %}" >
        <link rel="stylesheet" href="{% static 'vendor/aos/aos.css' %}" >
        <link rel="stylesheet" href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" >
        <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.css' %}" >
        <link rel="stylesheet" href="{% static 'vendor/boxicons/css/boxicons.min.css' %}" >
        <link rel="stylesheet" href="{% static 'vendor/remixicon/remixicon.css' %}" >
        <link rel="stylesheet" href="{% static 'vendor/swiper/swiper-bundle.min.css' %}" >

        <!-- Template Main CSS File -->
        <link rel="stylesheet" href="{% static 'css/styles.css' %}">


    </head>

      <body>
        <div class="container-fluid">
          <!-- ======= Header ======= -->
          <header id="header" class="fixed-top">
            <div class="container d-flex align-items-center">
              <a href="https://catalise.vercel.app" class="logo me-auto">
                <img src="{% static 'img/logo.png' %}" alt="Logo" class="img-fluid">
              </a>
              <nav id="navbar" class="navbar order-last order-lg-0">
                <ul>
                  <li><a class="active" href="https://catalise.vercel.app" >Home</a></li>
                  <li><a href="https://catalise.vercel.app/pricing.html">Preços</a></li>
                  <li><a  href="https://catalise.vercel.app/contact.html">Contato</a></li>
                  <li><a href="https://catalise.vercel.app/trainings.html">Treinamentos</a></li>
                </ul>
                <i class="bi bi-list mobile-nav-toggle"></i>
              </nav>
              <a href="https://catalise.vercel.app/calculos.html" class="get-started-btn">Cálculos</a>
            </div>
          </header>
          <!-- End Header -->
        
          <main id="main">
          
              <!-- ======= Breadcrumbs ======= -->
              <div class="breadcrumbs" data-aos="fade-in">
                  <div class="container">
                  </div>
              </div>
              <!-- End Breadcrumbs -->
              <br>
              <br>
            
              <!-- You only need this form and the styles.css -->
            
              
              
                  {% block content %}
                  {% endblock %}
              
              
            
              <div id="preloader"></div>
              <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i
                      class="bi bi-arrow-up-short"></i></a>
          
          </main>
      </div>


        <!-- Vendor JS Files -->
        <script src="{% static 'vendor/purecounter/purecounter_vanilla.js' %}"></script>
        <script src="{% static 'vendor/aos/aos.js' %}"></script>
        <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
        <script src="{% static 'vendor/swiper/swiper-bundle.min.js' %}"></script>
        <script src="{% static 'vendor/php-email-form/validate.js' %}"></script>
      
        <!-- Template Main JS File -->
        <script src="{% static 'js/scripts.js' %}"></script>
      
    </body>
    

</html>
